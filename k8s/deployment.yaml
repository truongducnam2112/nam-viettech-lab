apiVersion: apps/v1
kind: Deployment
metadata:
  name: nam-viettech-app
  labels:
    app: nam-viettech-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nam-viettech-app
  template:
    metadata:
      labels:
        app: nam-viettech-app
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
      - name: nam-viettech-app
        image: 475309741409.dkr.ecr.ap-southeast-2.amazonaws.com/nam-web-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
